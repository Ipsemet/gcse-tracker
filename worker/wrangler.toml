name = "gcse-hq-claude"
main = "worker.js"
compatibility_date = "2026-01-01"

[vars]
# Comma-separated list of origins allowed to call this worker.
# Leave empty only while testing — an empty list allows any origin.
ALLOWED_ORIGIN = "https://ipsemet.github.io,http://localhost:5173"

# Secrets (set with `npx wrangler secret put NAME`, never in this file):
#   ANTHROPIC_API_KEY   required
#   SHARED_SECRET       optional; if set, the app must send it as x-app-secret
